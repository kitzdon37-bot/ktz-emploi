  <circle cx="120" cy="72" r="22" fill="#F59E0B"/>
  <path d="M120 55 L124.5 67.5 L137 67.5 L127.5 75.5 L131 88 L120 81 L109 88 L112.5 75.5 L103 67.5 L115.5 67.5 Z" fill="white"/>

