  <circle cx="82" cy="405" r="22" fill="#F97316"/>
  <circle cx="82" cy="399" r="8" fill="white"/>
  <path d="M73 406 Q77 415 82 422 Q87 415 91 406 Q88 413 82 413 Q76 413 73 406 Z" fill="white"/>

