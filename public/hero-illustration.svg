  <rect x="490" y="45" width="95" height="7" rx="2" fill="white"/>
  <rect x="490" y="52" width="95" height="7" rx="2" fill="#289728"/>
  <rect x="490" y="59" width="95" height="7" rx="2" fill="#FFCB00"/>
  <rect x="528" y="38" width="7" height="28" rx="1" fill="#BC0026" opacity="0.85"/>
  <polygon points="494,42 500,38 497,46" fill="#FFCB00"/>
