  <circle cx="545" cy="420" r="22" fill="#EA580C"/>
  <path d="M536 420 Q536 412 545 412 Q554 412 554 420 L556 428 L534 428 Z" fill="white"/>
  <rect x="542" y="428" width="6" height="4" rx="3" fill="white"/>
  <circle cx="552" cy="414" r="5" fill="#FEF9C3"/>

