    <rect x="562" y="282" width="44" height="16" rx="8" fill="#FEF3C7"/>
    <rect x="509" y="286" width="44" height="7" rx="3" fill="#2563EB" opacity="0.7"/>
    <rect x="565" y="286" width="38" height="7" rx="3" fill="#D97706" opacity="0.7"/>
