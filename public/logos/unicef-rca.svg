<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 50">
  <!-- UNICEF — bleu officiel #1C92D0 -->
  <rect width="120" height="50" rx="8" fill="#1C92D0"/>
  <!-- Globe stylisé -->
  <circle cx="22" cy="25" r="14" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <ellipse cx="22" cy="25" rx="6" ry="14" fill="none" stroke="#ffffff" stroke-width="1.2"/>
  <line x1="8" y1="25" x2="36" y2="25" stroke="#ffffff" stroke-width="1.2"/>
  <line x1="10" y1="18" x2="34" y2="18" stroke="#ffffff" stroke-width="1"/>
  <line x1="10" y1="32" x2="34" y2="32" stroke="#ffffff" stroke-width="1"/>
  <!-- Texte -->
  <text x="43" y="22" font-family="Arial,sans-serif" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="1">UNICEF</text>
  <text x="43" y="36" font-family="Arial,sans-serif" font-size="8" font-weight="500" fill="#d0eeff" letter-spacing="0.3">For every child</text>
</svg>
