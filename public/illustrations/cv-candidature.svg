<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none">
  <!-- Shadow -->
  <rect x="84" y="16" width="80" height="118" rx="8" fill="#BFDBFE" opacity="0.5"/>
  <!-- Document -->
  <rect x="80" y="12" width="80" height="118" rx="8" fill="white"/>
  <!-- Blue header -->
  <rect x="80" y="12" width="80" height="36" rx="8" fill="#3B82F6"/>
  <rect x="80" y="30" width="80" height="18" fill="#3B82F6"/>
  <!-- Profile circle in header -->
  <circle cx="99" cy="30" r="12" fill="#1D4ED8"/>
  <circle cx="99" cy="25" r="5" fill="#EFF6FF" opacity="0.85"/>
  <ellipse cx="99" cy="36" rx="8" ry="5" fill="#EFF6FF" opacity="0.85"/>
  <!-- Name lines in header -->
  <rect x="117" y="21" width="34" height="5" rx="2.5" fill="white" opacity="0.9"/>
  <rect x="117" y="31" width="25" height="4" rx="2" fill="white" opacity="0.6"/>
  <!-- Thin divider -->
  <line x1="90" y1="57" x2="150" y2="57" stroke="#EFF6FF" stroke-width="1.5"/>
  <!-- Section heading 1 -->
  <rect x="90" y="63" width="30" height="4" rx="2" fill="#3B82F6"/>
  <!-- Content lines -->
  <rect x="90" y="73" width="60" height="3.5" rx="1.75" fill="#CBD5E1"/>
  <rect x="90" y="81" width="46" height="3.5" rx="1.75" fill="#CBD5E1"/>
  <rect x="90" y="89" width="53" height="3.5" rx="1.75" fill="#CBD5E1"/>
  <!-- Section heading 2 -->
  <rect x="90" y="100" width="25" height="4" rx="2" fill="#3B82F6"/>
  <!-- Content lines -->
  <rect x="90" y="110" width="58" height="3.5" rx="1.75" fill="#CBD5E1"/>
  <rect x="90" y="118" width="42" height="3.5" rx="1.75" fill="#CBD5E1"/>
  <!-- Green check badge -->
  <circle cx="152" cy="116" r="14" fill="#10B981"/>
  <path d="M145 116 L149.5 120.5 L160 110" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Pen decoration -->
  <g transform="rotate(20 192 25)">
    <rect x="186" y="8" width="10" height="38" rx="5" fill="#FBBF24"/>
    <polygon points="186,46 196,46 191,58" fill="#374151"/>
    <rect x="186" y="8" width="10" height="9" rx="4" fill="#D97706"/>
  </g>
  <!-- Dot accents -->
  <circle cx="48" cy="30" r="5" fill="#BFDBFE"/>
  <circle cx="38" cy="50" r="3.5" fill="#BFDBFE" opacity="0.6"/>
  <circle cx="54" cy="58" r="2.5" fill="#BFDBFE" opacity="0.4"/>
</svg>
